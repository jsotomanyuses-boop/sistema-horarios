<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Horas y Asistencia - Gestión de Personal</title>
<!-- Librerías para exportación a PDF HD -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --primary-blue: #009cde;
    --accent-orange: #f97316;
    --accent-purple: #a855f7;
    --bg-glass: rgba(255, 255, 255, 0.90);
    --border-glass: rgba(255, 255, 255, 0.5);
    --text-color: #1e293b;
  }

  * { box-sizing: border-box; }
  
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
    background-attachment: fixed;
    padding: 10px; 
    color: var(--text-color); 
    margin: 0; 
    width: 100vw;
    min-height: 100vh;
    overflow-x: hidden;
  }
  
  .container { 
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 12px; 
    padding: 15px; 
    box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.08); 
    width: 100%; 
    max-width: 100%; 
    margin: 0; 
  }
  
  .header-actions { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 15px; 
    flex-wrap: wrap; 
    gap: 15px; 
    border-bottom: 2px solid rgba(0, 156, 222, 0.15);
    padding-bottom: 12px;
  }
  
  h2 { margin: 0; font-size: 18px; color: #0f172a; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; display: inline-block; width: 6px; height: 18px; background: var(--primary-blue); border-radius: 3px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  
  input[type="month"], select { 
    padding: 7px 10px; 
    border: 1px solid #cbd5e1; 
    border-radius: 8px; 
    font-size: 12px; 
    background: rgba(255,255,255,0.9);
    outline: none;
    transition: all 0.2s;
  }
  input[type="month"]:focus, select:focus {
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 3px rgba(0, 156, 222, 0.15);
  }
  
  button { 
    background: var(--primary-blue); 
    color: white; 
    border: none; 
    padding: 8px 14px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: 600; 
    font-size: 12px; 
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(0, 156, 222, 0.2);
  }
  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  
  button.btn-success { 
    background: #059669; 
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
  }
  button.btn-pdf { 
    background: var(--accent-orange); 
    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
  }

  .table-responsive { 
    width: 100%; 
    overflow-x: auto; 
    margin-top: 8px; 
    border: 1px solid rgba(226, 232, 240, 0.8); 
    border-radius: 8px; 
    background: rgba(255,255,255,0.6);
  }

  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
  }

  th, td { 
    border: 1px solid #e2e8f0; 
    padding: 4px 2px; 
    text-align: center; 
    font-size: 10px; 
    white-space: nowrap; 
    overflow: hidden;
    text-overflow: ellipsis;
  }

  th { 
    background: #f8fafc; 
    color: #475569; 
    font-weight: bold; 
    position: sticky; 
    top: 0; 
    z-index: 2; 
    font-size: 9.5px;
  }
  
  .employee-col { 
    text-align: left; 
    width: 150px; 
    min-width: 150px;
    font-weight: bold; 
    background: #ffffff; 
    position: sticky; 
    left: 0; 
    z-index: 3; 
    font-size: 11px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 6px 8px; 
    border-right: 1px solid #e2e8f0; 
  }
  th.employee-col { 
    z-index: 4; 
    display: table-cell; 
    text-align: center; 
    background: #f8fafc; 
    width: 150px; 
  }
  
  .total-col { 
    font-weight: bold; 
    background: rgba(0, 156, 222, 0.05); 
    width: 90px; 
    min-width: 90px;
    font-size: 11px; 
    color: #0369a1; 
  }

  .day-cell { 
    cursor: pointer; 
    user-select: none; 
    height: 38px; 
    transition: all 0.15s; 
    vertical-align: middle; 
  }
  .day-cell:hover { filter: brightness(0.95); transform: scale(0.98); }
  
  .day-cell[data-state="turno"] { background: rgba(0, 156, 222, 0.12); color: #0369a1; font-weight: bold; }
  .day-cell[data-state="libre"] { background: rgba(249, 115, 22, 0.12); color: #c2410c; }
  .day-cell[data-state="vacaciones"] { background: rgba(168, 85, 247, 0.12); color: #7e22ce; }
  .day-cell[data-state="ausente"] { background: rgba(100, 116, 139, 0.12); color: #334155; }
  .day-cell[data-state="vacio"] { background: #ffffff; color: #cbd5e1; }

  .has-comment {
    position: relative;
  }
  .has-comment::after {
    content: '';
    position: absolute;
    top: 2px;
    right: 2px;
    width: 5px;
    height: 5px;
    background: var(--accent-orange);
    border-radius: 50%;
  }

  .btn-delete { 
    background: #ef4444; 
    color: white; 
    border: none; 
    border-radius: 4px; 
    width: 16px; 
    height: 16px; 
    font-size: 9px; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 0; 
    flex-shrink: 0; 
    box-shadow: none;
  }
  .btn-delete:hover { background: #dc2626; transform: none; }

  .legend { display: flex; gap: 12px; margin-top: 10px; font-size: 11px; align-items: center; flex-wrap: wrap; }
  .legend-box { width: 10px; height: 10px; border-radius: 3px; display: inline-block; vertical-align: middle; }

  .bottom-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid rgba(226, 232, 240, 0.8);
    flex-wrap: wrap;
    gap: 15px;
  }

  .export-group { display: flex; gap: 10px; }

  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 10; padding: 15px; }
  .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); animation: modalIn 0.2s ease; }
  
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-content h3 { margin-top: 0; font-size: 15px; color: #0f172a; margin-bottom: 12px; }
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #475569; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 6px 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; font-family: inherit; }
  .form-group textarea { resize: vertical; height: 55px; }
  
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
  .modal-actions button.cancel { background: #64748b; box-shadow: none; }
</style>
</head>
<body>

<div class="container" id="pdf-container">
  <div class="header-actions">
    <h2>Control de Horarios y Personal</h2>
    <div class="controls">
      <input type="month" id="month-picker" value="2026-09" onchange="initMonth()">
      <select id="period-picker" onchange="initMonth()">
        <option value="completo">📅 Mes Completo</option>
        <option value="q1">📌 1ra Quincena (1 - 15)</option>
        <option value="q2">📌 2da Quincena (16 - Fin)</option>
      </select>
      <button onclick="addEmployee()">Nuevo Empleado</button>
    </div>
  </div>

  <div class="legend">
    <span><i class="legend-box" style="background:rgba(0, 156, 222, 0.2)"></i> Turno</span>
    <span><i class="legend-box" style="background:rgba(249, 115, 22, 0.2)"></i> Libre</span>
    <span><i class="legend-box" style="background:rgba(168, 85, 247, 0.2)"></i> Vacaciones</span>
    <span><i class="legend-box" style="background:rgba(100, 116, 139, 0.2)"></i> Ausente</span>
    <span style="margin-left: auto; color: #64748b;">💡 <i>Haz clic en cualquier celda para editar turnos o comentarios.</i></span>
  </div>

  <div class="table-responsive">
    <table id="schedule-table">
      <thead>
        <tr id="header-row">
          <th class="employee-col">Colaborador</th>
          <th class="total-col" id="total-header-title">Total Horas</th>
        </tr>
      </thead>
      <tbody id="employee-tbody">
      </tbody>
    </table>
  </div>

  <!-- Botones de Exportación abajo y ocultos en PDF -->
  <div class="bottom-actions" id="action-buttons-bar">
    <span style="font-size: 11px; color: #64748b;">Gestión horarios y asistencias | v1.0</span>
    <div class="export-group">
      <button class="btn-success" onclick="exportToCSV()">📥 Exportar CSV</button>
      <button class="btn-pdf" id="btn-export-pdf" onclick="exportReportPDF()">📄 Descargar PDF HD</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="shift-modal">
  <div class="modal-content">
    <h3 id="modal-title">Configurar Día</h3>
    <div class="form-group">
      <label>Estado del día:</label>
      <select id="modal-type" onchange="toggleTimeInputs()">
        <option value="turno">Trabajado (Con horas)</option>
        <option value="libre">Libre</option>
        <option value="vacaciones">Vacaciones</option>
        <option value="ausente">Ausente</option>
        <option value="vacio">Sin Asignar</option>
      </select>
    </div>
    <div id="time-inputs-container">
      <div class="form-group">
        <label>Hora de Entrada:</label>
        <input type="time" id="modal-start" value="11:30">
      </div>
      <div class="form-group">
        <label>Hora de Salida:</label>
        <input type="time" id="modal-end" value="20:30">
      </div>
      <p style="font-size: 10px; color: #64748b; margin-top: -2px; margin-bottom: 8px;"><i>* Descuento automático de 1h de almuerzo.</i></p>
    </div>
    <div class="form-group">
      <label>Comentario / Nota (Ej: Trabajo de más, compensación):</label>
      <textarea id="modal-comment" placeholder="Ej. Trabajó 4 horas de compensación..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancelar</button>
      <button onclick="saveShiftData()">Guardar</button>
    </div>
  </div>
</div>

<script>
  let currentDaysCount = 31;
  let currentYear = 2026;
  let currentMonth = 9;
  let startDay = 1;
  let endDay = 31;
  let employees = [];
  let activeEdit = { empIndex: null, day: null };

  function loadData() {
    const saved = localStorage.getItem('business_employees_data_v5');
    if (saved) {
      employees = JSON.parse(saved);
    } else {
      // Sin empleados de prueba por defecto (vacío)
      employees = [];
    }
  }

  function saveData() {
    localStorage.setItem('business_employees_data_v5', JSON.stringify(employees));
  }

  function initMonth() {
    const val = document.getElementById('month-picker').value;
    const parts = val.split('-');
    currentYear = parseInt(parts[0], 10);
    currentMonth = parseInt(parts[1], 10);
    currentDaysCount = new Date(currentYear, currentMonth, 0).getDate();

    const period = document.getElementById('period-picker').value;
    if (period === 'q1') {
      startDay = 1;
      endDay = 15;
      document.getElementById('total-header-title').textContent = "Total (Q1)";
    } else if (period === 'q2') {
      startDay = 16;
      endDay = currentDaysCount;
      document.getElementById('total-header-title').textContent = "Total (Q2)";
    } else {
      startDay = 1;
      endDay = currentDaysCount;
      document.getElementById('total-header-title').textContent = "Total Mes";
    }
    
    loadData();
    buildTableHeaders();
    renderTable();
  }

  // Formato estricto dd/mm/yyyy con ceros iniciales
  function getFullDateStr(day) {
    const dStr = String(day).padStart(2, '0');
    const mStr = String(currentMonth).padStart(2, '0');
    return `${dStr}/${mStr}/${currentYear}`;
  }

  // Formato adaptativo para la interfaz / PDF (muestra solo el número de día si es mes completo)
  function getDisplayDateStr(day) {
    const period = document.getElementById('period-picker').value;
    if (period === 'completo') {
      return String(day);
    } else {
      const dStr = String(day).padStart(2, '0');
      const mStr = String(currentMonth).padStart(2, '0');
      return `${dStr}/${mStr}`;
    }
  }

  function buildTableHeaders() {
    const trHead = document.getElementById('header-row');
    const employeeTh = trHead.children[0];
    const totalTh = trHead.lastElementChild;
    
    trHead.innerHTML = '';
    trHead.appendChild(employeeTh);

    for (let d = startDay; d <= endDay; d++) {
      const th = document.createElement('th');
      th.textContent = getDisplayDateStr(d);
      trHead.appendChild(th);
    }

    trHead.appendChild(totalTh);
  }

  function renderTable() {
    const tbody = document.getElementById('employee-tbody');
    tbody.innerHTML = '';

    if (employees.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = (endDay - startDay + 2);
      td.style.textAlign = 'center';
      td.style.padding = '25px';
      td.style.color = '#64748b';
      td.innerHTML = 'No hay colaboradores registrados. Haz clic en <strong>"Nuevo Empleado"</strong> para comenzar.';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    employees.forEach((emp, empIndex) => {
      const tr = document.createElement('tr');
      
      const tdName = document.createElement('td');
      tdName.className = 'employee-col';
      
      const nameSpan = document.createElement('span');
      nameSpan.textContent = emp.name;
      tdName.appendChild(nameSpan);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn-delete';
      deleteBtn.textContent = '✕';
      deleteBtn.title = 'Eliminar empleado';
      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        deleteEmployee(empIndex);
      };
      tdName.appendChild(deleteBtn);

      tr.appendChild(tdName);

      for (let d = startDay; d <= endDay; d++) {
        const td = document.createElement('td');
        td.className = 'day-cell';
        
        const dayData = emp.schedule[d];
        if (dayData) {
          td.dataset.state = dayData.type;
          if (dayData.comment && dayData.comment.trim() !== '') {
            td.classList.add('has-comment');
          }
          
          if (dayData.type === 'turno') {
            td.innerHTML = `<span style="font-size:8px; display:block">${dayData.start}-${dayData.end}</span><strong>${dayData.netHours}:00</strong>`;
          } else {
            td.textContent = capitalizeState(dayData.type);
          }
        } else {
          td.dataset.state = 'vacio';
          td.textContent = '-';
        }

        td.addEventListener('click', () => openModal(empIndex, d));
        tr.appendChild(td);
      }

      const tdTotal = document.createElement('td');
      tdTotal.className = 'total-col';
      tdTotal.textContent = calculatePeriodNetHours(emp) + ':00 hrs';
      tr.appendChild(tdTotal);

      tbody.appendChild(tr);
    });
  }

  function openModal(empIndex, day) {
    activeEdit = { empIndex, day };
    const fullDateStr = getFullDateStr(day);
    document.getElementById('modal-title').textContent = `Fecha ${fullDateStr} - ${employees[empIndex].name}`;
    
    const currentData = employees[empIndex].schedule[day] || { type: 'turno', start: '11:30', end: '20:30', comment: '' };
    document.getElementById('modal-type').value = currentData.type;
    document.getElementById('modal-start').value = currentData.start || '11:30';
    document.getElementById('modal-end').value = currentData.end || '20:30';
    document.getElementById('modal-comment').value = currentData.comment || '';
    
    toggleTimeInputs();
    document.getElementById('shift-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('shift-modal').style.display = 'none';
  }

  function toggleTimeInputs() {
    const type = document.getElementById('modal-type').value;
    const container = document.getElementById('time-inputs-container');
    container.style.display = (type === 'turno') ? 'block' : 'none';
  }

  function saveShiftData() {
    const type = document.getElementById('modal-type').value;
    const start = document.getElementById('modal-start').value;
    const end = document.getElementById('modal-end').value;
    const comment = document.getElementById('modal-comment').value;
    
    let netHours = 0;
    if (type === 'turno') {
      const [startH, startM] = start.split(':').map(Number);
      const [endH, endM] = end.split(':').map(Number);
      let diff = (endH + endM / 60) - (startH + startM / 60);
      if (diff < 0) diff += 24; 
      netHours = Math.max(0, Math.floor(diff - 1)); // Descuenta 1h de almuerzo
    }

    employees[activeEdit.empIndex].schedule[activeEdit.day] = { type, start, end, netHours, comment };
    saveData();
    closeModal();
    renderTable();
  }

  function calculatePeriodNetHours(emp) {
    let total = 0;
    for (let d = startDay; d <= endDay; d++) {
      if (emp.schedule[d] && emp.schedule[d].type === 'turno') {
        total += emp.schedule[d].netHours || 0;
      }
    }
    return total;
  }

  function addEmployee() {
    const name = prompt("Ingrese el nombre del nuevo colaborador:");
    if (name && name.trim() !== "") {
      employees.push({ name: name.trim(), schedule: {} });
      saveData();
      renderTable();
    }
  }

  function deleteEmployee(empIndex) {
    if (confirm(`¿Estás seguro de eliminar a ${employees[empIndex].name}?`)) {
      employees.splice(empIndex, 1);
      saveData();
      renderTable();
    }
  }

  function capitalizeState(str) {
    if (!str) return '';
    if (str === 'turno') return 'Trabajado';
    if (str === 'libre') return 'Libre';
    if (str === 'vacaciones') return 'Vacaciones';
    if (str === 'ausente') return 'Ausente';
    return str;
  }

  function exportToCSV() {
    const monthVal = document.getElementById('month-picker').value;
    const period = document.getElementById('period-picker').value;
    
    let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // BOM para compatibilidad con Excel
    let headers = ["Nombre", "Fecha", "Estado", "Hora Inicio", "Hora Fin", "Almuerzo", "Horas Trabajadas"];
    csvContent += headers.join("\t") + "\r\n";

    employees.forEach(emp => {
      for (let d = startDay; d <= endDay; d++) {
        const data = emp.schedule[d];
        const fechaStr = getFullDateStr(d); // Formato estricto dd/mm/yyyy
        
        let estado = "Sin Asignar";
        let horaInicio = "0:00";
        let horaFin = "0:00";
        let almuerzo = "0:00";
        let horasTrabajadas = "0:00";

        if (data) {
          estado = capitalizeState(data.type);
          if (data.type === 'turno') {
            horaInicio = data.start;
            horaFin = data.end;
            almuerzo = "1:00";
            horasTrabajadas = `${data.netHours}:00`;
          }
        }

        let row = [
          emp.name,
          fechaStr,
          estado,
          horaInicio,
          horaFin,
          almuerzo,
          horasTrabajadas
        ];

        csvContent += row.join("\t") + "\r\n";
      }
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `reporte_horas_${period}_${monthVal}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  async function exportReportPDF() {
    const { jsPDF } = window.jspdf;
    const btn = document.getElementById('btn-export-pdf');
    const bottomBar = document.getElementById('action-buttons-bar');
    const deleteBtns = document.querySelectorAll('.btn-delete');
    
    const originalText = btn.innerText;
    btn.innerText = '⏳ Generando PDF HD...';
    btn.disabled = true;

    bottomBar.style.display = 'none';
    deleteBtns.forEach(b => b.style.display = 'none');

    try {
      const targetContainer = document.getElementById('pdf-container');
      
      const canvas = await html2canvas(targetContainer, {
        backgroundColor: '#ffffff',
        scale: 3,
        useCORS: true,
        logging: false
      });

      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      
      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'mm',
        format: 'a4'
      });

      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

      pdf.addImage(imgData, 'JPEG', 0, 5, pdfWidth, pdfHeight);
      
      const monthVal = document.getElementById('month-picker').value;
      const period = document.getElementById('period-picker').value;
      pdf.save(`reporte_asistencia_${period}_${monthVal}.pdf`);

    } catch (error) {
      console.error('Error generando PDF:', error);
      alert('Ocurrió un error al generar el PDF.');
    } finally {
      bottomBar.style.display = 'flex';
      deleteBtns.forEach(b => b.style.display = 'flex');
      btn.innerText = originalText;
      btn.disabled = false;
    }
  }

  initMonth();
</script>

</body>
</html>
